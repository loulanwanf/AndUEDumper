name: Build UEDumper (GUI Final)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 修正子模块协议
        run: git config --global url."https://github.com/".insteadOf git://github.com/

      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 配置 NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "NDK_HOME=${{ github.workspace }}/android-ndk-r25c" >> $GITHUB_ENV
          echo "${{ github.workspace }}/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # 终极修补方案：放弃加函数，直接把 UObject 的 protected 改为 public！
      - name: 自动修复第三方库兼容性及成员访问权限
        run: |
          cd AndUEDumper
          
          # 1. 修复 nlohmann/json.hpp 的 std::u8string 类型转换错误
          sed -i 's/const std::u8string s = p.u8string();/const std::string s = p.u8string();/' ../deps/nlohmann/json.hpp
          
          # 2. 全文件替换：把所有 protected 改成 public，消除保护壁垒
          sed -i 's/protected:/public:/' src/UE/UEWrappers.hpp

          # 3. 修改 Dumper.cpp：直接访问改完权限后的 object 指针，摒弃 getObject()
          sed -i 's/(uintptr_t)pkg.first == (uintptr_t)packageObj.getObject()/(uintptr_t)pkg.first == (uintptr_t)packageObj.object/' src/Dumper.cpp

      - name: 执行 CMake 构建 (ImGui GUI 版本)
        run: |
          cd AndUEDumper
          chmod +x build.sh
          echo "1" | ./build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: UEDump3r-GUI-Binary
          path: AndUEDumper/ndk_build/libs/**/UEDump3r
