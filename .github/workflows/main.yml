name: Build UEDumper (GUI Final)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 修正子模块协议
        run: git config --global url."https://github.com/".insteadOf git://github.com/

      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 配置 NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "NDK_HOME=${{ github.workspace }}/android-ndk-r25c" >> $GITHUB_ENV
          echo "${{ github.workspace }}/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # 终极修复方案
      - name: 修复指针比较歧义和私有属性
        run: |
          cd AndUEDumper
          # 修复 json 头文件错误
          sed -i 's/const std::u8string s = p.u8string();/const std::string s = p.u8string();/' ../deps/nlohmann/json.hpp
          # 解除访问限制
          sed -i 's/protected:/public:/g' src/UE/UEWrappers.hpp
          # 修复歧义比较
          sed -i 's|pkg.first == packageObj|pkg.first == packageObj.object|' src/Dumper.cpp

      - name: 执行 CMake 构建 (ImGui GUI 版本)
        run: |
          cd AndUEDumper
          chmod +x build.sh
          echo "1" | ./build.sh

      # 重点修正：把原本错误的 ndk_build 改成 cmake_build！
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: UEDump3r-GUI-Binary
          path: AndUEDumper/cmake_build/**/UEDump3r
