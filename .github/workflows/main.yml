name: Build UEDumper
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 强制修正 Git 协议
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global url."https://".insteadOf git://

      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载并配置 NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "NDK_HOME=${{ github.workspace }}/android-ndk-r25c" >> $GITHUB_ENV
          echo "${{ github.workspace }}/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 执行官方构建脚本
        run: |
          cd AndUEDumper
          chmod +x build.sh
          # 自动输入2并执行脚本
          echo "2" | ./build.sh
            # 替换你原有的步骤，改成这个：
      - name: 执行官方构建脚本
        run: |
          cd AndUEDumper
          chmod +x build.sh
          echo "2" | ./build.sh

      - name: 自动打包成自解压 SH 脚本
        run: |
          cd AndUEDumper
          
          # 1. 创建一个 Shell 外壳脚本
          cat > AutoUEDump_GUI.sh << 'EOF'
          #!/bin/bash
          # ===============================
          # 以下放入截图里 1~48 行的解压/清理/临时目录设置代码
          # ===============================
          # (如果你有原版这 48 行代码，直接粘贴到这个位置即可)
          # ===============================
          echo "正在解包核心工具..."
          EOF
          
          # 2. 把编译出来的 UEDump3r 文件进行 base64 编码，追加到脚本末尾
          echo "# 这里是二进制载荷" >> AutoUEDump_GUI.sh
          base64 -w 0 ndk_build/libs/arm64-v8a/UEDump3r >> AutoUEDump_GUI.sh
          
          # 3. 给最终脚本赋予执行权限
          chmod +x AutoUEDump_GUI.sh

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: UEDump3r-binaries
          # 这次上传那个“外壳+数据”一体的单文件
          path: AndUEDumper/AutoUEDump_GUI.sh
