name: Build UEDumper (GUI Final)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 修正子模块协议
        run: git config --global url."https://github.com/".insteadOf git://github.com/

      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 配置 NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "NDK_HOME=${{ github.workspace }}/android-ndk-r25c" >> $GITHUB_ENV
          echo "${{ github.workspace }}/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # 重点：本次终极修补，绕过所有编译权限陷阱
      - name: 自动修复第三方库兼容性和 UE 类结构
        run: |
          cd AndUEDumper
          
          # 1. 修复 nlohmann/json.hpp 的 std::u8string 类型转换错误
          sed -i 's/const std::u8string s = p.u8string();/const std::string s = p.u8string();/' ../deps/nlohmann/json.hpp
          
          # 2. 给 UEWrappers.hpp 里的 UE_UObject 类添加一个公共 getter 方法，绕开 protected 限制
          sed -i '/protected:/a \    uint8_t* getObject() const { return object; }' src/UE/UEWrappers.hpp

          # 3. 修改 Dumper.cpp 里的比较代码，调用刚才加上的公共 getter 方法
          sed -i 's/pkg.first == packageObj/(uintptr_t)pkg.first == (uintptr_t)packageObj.getObject()/' src/Dumper.cpp

      - name: 执行 CMake 构建 (ImGui GUI 版本)
        run: |
          cd AndUEDumper
          chmod +x build.sh
          echo "1" | ./build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: UEDump3r-GUI-Binary
          path: AndUEDumper/ndk_build/libs/**/UEDump3r
