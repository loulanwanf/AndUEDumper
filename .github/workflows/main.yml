name: Build UEDumper
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 提前配置 git，把 git:// 协议全部强制替换为 https://，防网络超时
      - name: 配置 Git 协议替换
        run: git config --global url."https://github.com/".insteadOf git://github.com/

      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 下载并配置 NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "NDK_HOME=${{ github.workspace }}/android-ndk-r25c" >> $GITHUB_ENV
          echo "${{ github.workspace }}/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 编译
        run: |
          cd AndUEDumper/AndUEDumper
          make clean && make

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: UEDump3r-binaries
          path: AndUEDumper/AndUEDumper/UEDump3r*
