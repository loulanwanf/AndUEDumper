name: Build UEDumper
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 强制替换 git 协议为 https，避开网络超时
      - name: 强制修正 Git 协议
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global url."https://".insteadOf git://

      # 拉取代码（含子模块），特别设置了重试机制防断连
      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载并配置 NDK r25c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "NDK_HOME=${{ github.workspace }}/android-ndk-r25c" >> $GITHUB_ENV
          echo "${{ github.workspace }}/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: 编译
        run: |
          cd AndUEDumper/AndUEDumper
          make clean && make

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: UEDump3r-binaries
          path: AndUEDumper/AndUEDumper/UEDump3r*
